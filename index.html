<!doctype html>
<html lang="en" data-release="0235bd7c08-00b488c873">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Idle SAQ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Idle SAQ: Slaying and Questing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" />
    <link rel="stylesheet" href="./style.css?v=00b488c873" />
  </head>
  <body>
    <div id="game-container">
      <nav id="top-nav">
        <div class="logo">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M16 6l7 3v6c0 5-3 8.5-7 10-4-1.5-7-5-7-10V9z" fill="#0f172a" stroke="#00d2ff" stroke-width="1.6"/><path d="M16 9v13M13 12h6" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>IDLE <b>SAQ</b></span>
        </div>
        <div class="nav-right">
          <div class="purse" title="Gold"><span class="coin"></span><b id="hud-coins"></b><small id="hud-sub"></small></div>
          <button id="toggle-auto" data-act="toggleAuto" title="Cast skills automatically"></button>
          <button id="btn-menu-hub" data-act="hub" data-arg="" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><i class="dot"></i></button>
        </div>
      </nav>

      <section id="battle">
      <div id="canvas-container">
        <div id="canvas-top-hud">
          <div class="plate hero-plate" id="hero-plate"><span class="plate-face" id="hero-face"></span><div class="plate-main"><div class="plate-name"><b id="hero-name"></b><span class="plate-tags" id="hero-tags"></span></div><div class="plate-bar"><i class="chip-bar" id="hud-hp-chip"></i><i id="hud-hp-bar"></i><b id="hud-hp"></b></div><div class="plate-wb" id="hud-wb"></div></div></div>
          <div class="stage-badge" id="stage-badge"></div>
        </div>
        <div class="plate foe-plate boss-bar gone" id="foe-plate"></div>
        <canvas id="scene" aria-label="Battle. Tap to strike, hold to fight faster."></canvas>
        <div id="tap-hint" hidden><i></i>Tap to strike · Hold to fight faster</div>
        <div id="tip" hidden></div>
        <div id="challenge" hidden></div>
        <div id="control-bar"></div>
        <div id="skill-bar"></div>
        <div id="squad-bar"></div>
      </div>

      <div id="global-xp-header"></div>
      <div id="log-panel" hidden><div id="feed" aria-live="polite"></div></div>
      </section>

      <div id="panel-handle" data-act="panelSize" data-arg="" role="button" aria-label="Resize the panel"><i></i></div>
      <div id="panel-scroll">
      <div id="panel"></div>

      <footer id="footer">
        <div class="footer-row">
          <button class="foot-btn" data-act="toggleLogs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11v13a3 3 0 0 1-3 3H6a2 2 0 0 1-2-2v-2h11v2a2 2 0 0 0 2 2"/><path d="M7 4a2 2 0 0 0-2 2v10M10 8.5h5M10 12h5"/></svg> Toggle Battle Logs</button>
          <button class="foot-btn danger" data-act="hub" data-arg="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.3"/></svg> Wipe Save</button>
        </div>
      </footer>
      </div>

      <nav id="menu-panel" aria-label="Tabs"></nav>
    </div>
    <div id="sheet"></div>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
    <script type="module" src="./game.js?v=0235bd7c08"></script>
  </body>
</html>
