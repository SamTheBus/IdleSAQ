<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" />
    <title>Idle SAQ: Slaying and Questing</title>
    <link rel="stylesheet" href="./style.css?v=3d5e581694" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Idle SAQ <small>Slaying and Questing</small></h1>
        <div id="res"></div>
      </header>
      <main>
        <section id="battle">
          <div id="stagebar">
            <button class="btn" id="stage-prev" data-act="stagePrev" aria-label="Previous stage">◀</button>
            <div id="stage-title"></div>
            <button class="btn" id="stage-next" data-act="stageNext" aria-label="Next stage">▶</button>
          </div>
          <canvas id="scene" aria-label="Battle. Hold to fight faster."></canvas>
          <div id="progress"></div>
          <div id="controls"></div>
          <div id="skills"></div>
          <div id="feed" aria-live="polite"></div>
        </section>
        <section id="side">
          <nav id="tabs"></nav>
          <div id="panel"></div>
        </section>
      </main>
    </div>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
    <script type="module" src="./game.js?v=bc15527296"></script>
  </body>
</html>
